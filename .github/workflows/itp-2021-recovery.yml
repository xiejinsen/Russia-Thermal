name: Kutateladze 2021 Missing Page Recovery

on:
  push:
    paths:
      - tools/itp_2021_recovery.py
      - .github/workflows/itp-2021-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itp-2021-low-rate-recovery
  cancel-in-progress: false

jobs:
  recover-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Recover remaining missing 2021 pages with low-rate requests with low-rate requests
        run: python -u tools/itp_2021_recovery.py --max-pages 20 --min-delay 2.5
      - name: Rebuild 2021 review queue from recovered original bibliography
        run: python tools/itp_triage_build.py --years 2021
      - name: Validate review queue references against original citations
        run: python tools/itp_triage_audit.py
      - name: Archive retry log and recovered rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itp-2021-rescue-evidence
          path: |
            analysis/output-measurement/itp-annual-raw/2021-candidates.tsv
            analysis/output-measurement/itp-annual-raw/retrieval-manifest.json
            analysis/output-measurement/itp-annual-raw/2021-recovery-attempts.json
          retention-days: 30
      - name: Commit recovered raw evidence and diagnostic attempts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output-measurement/itp-annual-raw/ analysis/output-measurement/pilot-v1/triage/2021-keyword-candidates.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Academic output: preserve bounded 2021 page recovery results"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
