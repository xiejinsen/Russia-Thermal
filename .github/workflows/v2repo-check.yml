name: V2.1 Repository Health

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  v2-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical references and generated views
        run: python tools/v2repo.py --check
