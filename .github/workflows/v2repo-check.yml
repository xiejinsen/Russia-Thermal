name: V2.1 Repository Health

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  v2-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical references and generated views
        run: python tools/v2repo.py --check
      - name: Scan source dedup candidates
        run: python tools/source_dedup.py --scan
      - name: Audit decision graph and evidence chains
        run: python tools/graph_audit.py
      - name: Audit Russia Capability Atlas coverage
        run: python tools/atlas_coverage_audit.py --summary
      - name: Validate academic-first research routing
        run: python tools/actor_research_router.py
      - name: Audit official Kutateladze catalog extraction
        run: python tools/itp_catalog_quality.py
      - name: Audit Kutateladze title-triage provenance
        run: python tools/itp_triage_audit.py
      - name: Audit output-measurement sample identities
        run: python tools/output_measurement_audit.py
