name: Web UI Check

on:
  push:
    branches:
      - main
    paths:
      - "01-evidence/**"
      - "02-claims/**"
      - "03-actors/**"
      - "04-capabilities/**"
      - "05-directions/**"
      - "07-decisions/**"
      - "tools/v2repo.py"
      - "web/**"
      - ".github/workflows/web-ui-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "01-evidence/**"
      - "02-claims/**"
      - "03-actors/**"
      - "04-capabilities/**"
      - "05-directions/**"
      - "07-decisions/**"
      - "tools/v2repo.py"
      - "web/**"
      - ".github/workflows/web-ui-check.yml"

jobs:
  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type and Astro checks
        run: npm run check
      - name: Build static site
        run: npm run build
