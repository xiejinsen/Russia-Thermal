name: Kutateladze Public Catalog Pilot

on:
  push:
    paths:
      - tools/itp_catalog_extract.py
      - .github/workflows/itp-catalog-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-official-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Retrieve every listed Article page across five completed years
        run: python tools/itp_catalog_extract.py --years 2021 2022 2023 2024 2025
      - name: Upload raw candidate records and retrieval manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itp-2021-2025-article-discovery
          path: analysis/output-measurement/itp-annual-raw/
          retention-days: 30
      - name: Commit raw discovery snapshot (not verified paper totals)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output-measurement/itp-annual-raw/
          if ! git diff --cached --quiet; then
            git commit -m "Academic output: archive unverified Kutateladze yearly candidate bibliography"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
