name: Kutateladze Public Catalog Pilot

on:
  push:
    paths:
      - tools/itp_catalog_extract.py
      - .github/workflows/itp-catalog-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Probe all five annual catalog entry pages
        run: python tools/itp_catalog_extract.py --probe
      - name: Upload probe manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itp-catalog-probe
          path: analysis/output-measurement/itp-annual-raw/
          retention-days: 7
